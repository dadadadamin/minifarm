spring.application.name=minifarm


# --------------------------------------------
# Server
# --------------------------------------------
server.port=8080

# --------------------------------------------
# DataSource (PostgreSQL)
# --------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/minifarm
spring.datasource.username=minifarm
spring.datasource.password=minifarm

# --------------------------------------------
# JPA / Hibernate
# --------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --------------------------------------------
# Flyway
# --------------------------------------------
spring.flyway.enabled=true

# --------------------------------------------
# (선택) JDK 21 Virtual Threads
# --------------------------------------------
spring.threads.virtual.enabled=true


####################################
####################################
####################################
####################################
####################################추가로 넣은 사항 리팩토링시 조정


spring.jpa.open-in-view=false

# --------------------------------------------
# Flyway (마이그레이션 위치 지정/초기 테이블 공존 시)
# --------------------------------------------
spring.flyway.locations=classpath:db/migration
# 기존에 테이블이 조금 있는 상태에서 V1부터 적용하려면(선택)
# spring.flyway.baseline-on-migrate=true

# --------------------------------------------
# Multipart (카메라 이미지 업로드)
# --------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --------------------------------------------
# 파일 저장 루트(이미지 경로만 DB에 저장)
# --------------------------------------------
minifarm.storage.root=./uploads

# --------------------------------------------
# MQTT (라즈베리파이와 브로커 사용 시)
# --------------------------------------------
minifarm.mqtt.broker=tcp://localhost:1883
minifarm.mqtt.client-id=minifarm-server
# 인증 쓰면(선택)
# minifarm.mqtt.username=
# minifarm.mqtt.password=

# --------------------------------------------
# WebSocket (도메인 제한; 로컬 개발은 * 허용 가능)
# --------------------------------------------
minifarm.websocket.allowed-origins=*

# --------------------------------------------
# SUDA Kit (로컬 프록시; 실제 포트로 교체)
# --------------------------------------------
suda.base-url=http://localhost:7000